name: X ingest and alert checks

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Ingest tracked X posts
        run: |
          curl --fail --show-error --silent --max-time 120 \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://onchainpulse.app/api/cron/x-ingest

      - name: Check Telegram alerts and daily briefs
        run: |
          curl --fail --show-error --silent --max-time 120 \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://onchainpulse.app/api/alerts/check
